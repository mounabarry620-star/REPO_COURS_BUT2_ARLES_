<div class="graphique">
  <canvas role="img" aria-label="{{description}}"></canvas>
</div>
<div class="tableau-conteneur">
  <table class="tableau-historique">
    <caption>Chiffres {{source}} par session</caption>
    <thead>
      <tr>
        <th scope="col">Session</th>
        {{#each colonnes}}
        <th scope="col">{{this}}</th>
        {{/each}}
      </tr>
    </thead>
    <tbody>
      {{#each annees}}
      <tr>
        <th scope="row">{{annee}}</th>
        {{#each valeurs}}
        <td>{{this}}</td>
        {{/each}}
      </tr>
      {{/each}}
    </tbody>
  </table>
</div>
<div class="encadre">
  {{#each explications}}
  <p><strong>{{terme}}</strong> : {{definition}}</p>
  {{/each}}
</div>
